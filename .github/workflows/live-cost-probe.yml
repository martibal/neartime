name: Live Cost Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-cost-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run bounded live cost sample
        env:
          NEARTIME_TEST_DATABASE_URL: ${{ secrets.NEARTIME_TEST_DATABASE_URL }}
          NEARTIME_LIVE_PROBE_TOKEN: ${{ secrets.NEARTIME_LIVE_PROBE_TOKEN }}
          NEARTIME_LIVE_SEARCH_URL: https://neartime-mbalstad-1809s-projects.vercel.app/api/search
        run: node scripts/run-live-cost-probe.js
