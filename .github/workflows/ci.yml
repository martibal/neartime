name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Cost gate concurrency test
        env:
          NEARTIME_TEST_DATABASE_URL: ${{ secrets.NEARTIME_TEST_DATABASE_URL }}
        run: npm run test:cost-gate-concurrency

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor
