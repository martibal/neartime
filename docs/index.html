<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balstad</title>
  <meta name="description" content="Balstad develops and publishes software applications and digital products.">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #202124;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 96px 28px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 48px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    p {
      max-width: 650px;
      margin: 0 0 20px;
      font-size: 19px;
      line-height: 1.65;
    }

    .project {
      margin-top: 52px;
      padding-top: 32px;
      border-top: 1px solid #d7d7d2;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 26px;
    }

    .footer {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid #d7d7d2;
      font-size: 15px;
      color: #666;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Balstad</h1>

    <p>
      Balstad develops and publishes software applications and digital products.
    </p>

    <div class="project">
      <h2>WayNear</h2>
      <p>
        WayNear is a mobile application for discovering places based on travel
        time and user-defined criteria.
      </p>
    </div>

    <div class="footer">
      <p>Martin Balstad · Oslo, Norway</p>
      <p>Contact: <a href="mailto:waynearapp@gmail.com">waynearapp@gmail.com</a></p>
    </div>
  </main>
</body>
</html>
